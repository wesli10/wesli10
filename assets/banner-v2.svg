<svg xmlns="http://www.w3.org/2000/svg" width="780" height="139" viewBox="0 0 900 160" role="img" aria-labelledby="t">
  <title id="t">Wesley Lins Soares - Backend Software Engineer</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .prompt { fill: #3fb950; font-size: 22px; }
    .cmd { fill: #c9d1d9; font-size: 22px; }
    .role { fill: #58a6ff; font-size: 34px; font-weight: 700; }
    .cursor { fill: #58a6ff; opacity: 0; animation: blink 1s steps(1) 3.4s infinite; }
    #c1 rect { width: 0; animation: type1 1.2s steps(21) 0.4s forwards; }
    #c2 rect { width: 0; animation: type2 1.6s steps(25) 1.9s forwards; }
    @keyframes type1 { to { width: 290px; } }
    @keyframes type2 { to { width: 520px; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      #c1 rect { animation: none; width: 290px; }
      #c2 rect { animation: none; width: 520px; }
      .cursor { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <clipPath id="c1"><rect x="40" y="40" height="40"/></clipPath>
    <clipPath id="c2"><rect x="40" y="88" height="48"/></clipPath>
