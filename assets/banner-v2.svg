  <rect width="900" height="160" rx="10" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="899" height="159" rx="10" fill="none" stroke="#30363d"/>
  <circle cx="830" cy="22" r="5" fill="#30363d"/>
  <circle cx="850" cy="22" r="5" fill="#30363d"/>
  <circle cx="870" cy="22" r="5" fill="#30363d"/>
  <g clip-path="url(#c1)">
